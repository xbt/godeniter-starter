<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0f172a; color: #f8fafc; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { width: 360px; background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h2 { font-size: 18px; margin-bottom: 20px; text-align: center; color: #38bdf8; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
        input { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; font-size: 13px; }
        input:focus { outline: none; border-color: #0284c7; }
        button { width: 100%; background: #0284c7; color: #fff; border: none; padding: 10px; border-radius: 6px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        button:hover { background: #0369a1; }
        .error { color: #ef4444; font-size: 12px; margin-bottom: 14px; text-align: center; }
        .tip { font-size: 12px; color: #94a3b8; margin-top: 16px; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🔐 {{ .Title }}</h2>
        {{ if .Error }}
        <div class="error">{{ .Error }}</div>
        {{ end }}
        <form action="/login" method="POST">
            <div class="form-group">
                <label>管理员账号</label>
                <input type="text" name="username" value="{{ .Username }}" required placeholder="admin">
            </div>
            <div class="form-group">
                <label>登录密码</label>
                <input type="password" name="password" required placeholder="123456">
            </div>
            <button type="submit">立即登录</button>
        </form>
        <div class="tip">测试账号: <code>admin</code> / 密码: <code>123456</code></div>
    </div>
</body>
</html>
